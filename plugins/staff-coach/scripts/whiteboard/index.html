<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Whiteboard — Staff Coach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; }
    body { font-family: system-ui, sans-serif; background: #f8f9fa; }

    #toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    #send-btn {
      background: #1d6bf3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #send-btn:hover { background: #1558d6; }
    #send-btn:disabled { background: #8ab3f8; cursor: not-allowed; }

    #status {
      font-size: 13px;
      color: #57606a;
      min-width: 120px;
    }
    #status.ok  { color: #1a7f37; font-weight: 600; }
    #status.err { color: #cf222e; font-weight: 600; }
  </style>
  <script>
    window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
  </script>
</head>
<body>
  <div id="root"></div>

  <div id="toolbar">
    <button id="send-btn">Send to coach</button>
    <span id="status">Ready</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "react":        "https://esm.sh/react@18",
      "react-dom":    "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.0"
    }
  }
  </script>

  <script type="module">
    import React                      from "react";
    import { createRoot }             from "react-dom/client";
    import {
      Excalidraw,
      exportToBlob,
      serializeAsJSON
    } from "@excalidraw/excalidraw";

    let excalidrawAPI = null;

    function App() {
      return React.createElement(
        "div",
        { style: { width: "100%", height: "100vh" } },
        React.createElement(Excalidraw, {
          excalidrawAPI: (api) => { excalidrawAPI = api; },
        })
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(React.createElement(App));

    // ── Send to coach ─────────────────────────────────────────────────────────
    const btn    = document.getElementById("send-btn");
    const status = document.getElementById("status");

    btn.addEventListener("click", async () => {
      if (!excalidrawAPI) {
        status.textContent = "Canvas not ready";
        status.className = "err";
        return;
      }

      btn.disabled = true;
      status.className = "";
      status.textContent = "Exporting…";

      try {
        const elements = excalidrawAPI.getSceneElements();
        const appState = excalidrawAPI.getAppState();
        const files    = excalidrawAPI.getFiles();

        // PNG blob → base64
        const blob = await exportToBlob({
          elements,
          appState: { ...appState, exportBackground: true },
          files,
          mimeType: "image/png",
        });
        const reader = new FileReader();
        const png_base64 = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(reader.result.replace(/^data:[^,]+,/, ""));
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        // Scene JSON
        const scene_json = JSON.parse(serializeAsJSON(elements, appState, files, "local"));

        // POST to server
        const resp = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ png_base64, scene_json }),
        });

        if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
        const { png } = await resp.json();

        // e.g. /Users/…/canvas/board-3.png → "board-3"
        const label = (png || "").split(/[/\\]/).pop()?.replace(/\.png$/, "") || "board";
        status.textContent = `Sent ✓ ${label}`;
        status.className = "ok";
      } catch (err) {
        console.error("Send to coach failed:", err);
        status.textContent = `Error: ${err.message}`;
        status.className = "err";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
